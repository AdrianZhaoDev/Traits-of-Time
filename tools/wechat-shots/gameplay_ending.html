<!doctype html><html><head><meta charset="utf-8"><style>
:root{
  --bg:#0e1017;
  --panel:#181c26;
  --panel-light:#222838;
  --border:#2f3647;
  --gold:#ffbe0b;
  --cyan:#00f0ff;
  --red:#ff3366;
  --green:#05dfb7;
  --text:#f0f4fc;
  --sub:#8e99ae;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  width:375px;height:812px;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  overflow:hidden;display:flex;flex-direction:column;
}
.wx-topbar{
  height:44px;padding:0 16px;display:flex;justify-content:space-between;align-items:center;
  background:#11131a;border-bottom:1px solid rgba(255,255,255,0.08);flex-shrink:0;
}
.wx-game-name{font-size:14px;font-weight:bold;color:#fff}
.wx-capsule{
  width:84px;height:30px;border:1px solid rgba(255,255,255,0.25);background:rgba(0,0,0,0.5);
  border-radius:15px;display:flex;align-items:center;justify-content:space-around;padding:0 6px;
}
.wx-dots{display:flex;gap:3px}
.wx-dots span{width:4px;height:4px;background:#fff;border-radius:50%}
.wx-divider{width:1px;height:14px;background:rgba(255,255,255,0.2)}
.wx-circle{width:13px;height:13px;border:2px solid #fff;border-radius:50%}

.end-box{flex:1;padding:20px;display:flex;flex-direction:column;justify-content:space-between;background:#11131a}
.end-card{background:var(--panel);border:1.5px solid var(--gold);border-radius:12px;padding:24px 18px;display:flex;flex-direction:column;align-items:center;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,0.6)}
.epitaph{font-size:11px;color:var(--gold);letter-spacing:3px;margin-bottom:6px}
.title{font-size:24px;font-weight:900;color:#fff;margin-bottom:12px}
.desc{font-size:13px;color:var(--sub);line-height:1.6;margin-bottom:20px}
.ach-list{width:100%;background:#13151f;border:1px solid var(--border);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px;text-align:left;margin-bottom:16px}
.ach-item{display:flex;align-items:center;gap:10px}
.btn{width:220px;height:44px;background:linear-gradient(135deg, #00f0ff, #0077ff);border:none;border-radius:22px;color:#000;font-size:15px;font-weight:bold;cursor:pointer;margin:0 auto}
</style></head><body>
<div class="wx-topbar"><div class="wx-game-name">穿越了这次我带大喇叭逆袭</div><div class="wx-capsule"><div class="wx-dots"><span></span><span></span><span></span></div><div class="wx-divider"></div><div class="wx-circle"></div></div></div>
<div class="end-box">
  <div class="end-card">
    <div class="epitaph">LIFE SUMMARY · 人生总结画卷</div>
    <div class="title">市井呼啸名士</div>
    <div class="desc">享年六十八岁。从一介携古怪喇叭的市井少年起步，靠现代认知平息灾民踩踏，后被知县引为幕宾，安稳一生，子孙满堂。</div>
    <div class="ach-list">
      <div style="font-size:11px;font-weight:bold;color:var(--sub);border-bottom:1px solid var(--border);padding-bottom:4px">🏆 本局达成专属成就</div>
      <div class="ach-item"><span style="font-size:18px">📢</span><div><div style="font-size:13px;font-weight:bold;color:var(--gold)">【叫号有序】</div><div style="font-size:11px;color:var(--sub)">大喇叭一喊，上千人老老实实排队领粮</div></div></div>
      <div class="ach-item"><span style="font-size:18px">📜</span><div><div style="font-size:13px;font-weight:bold;color:#fff">【福寿双全】</div><div style="font-size:11px;color:var(--sub)">乱世之中安稳避开战乱与饥困，寿终正寝</div></div></div>
    </div>
  </div>
  <button class="btn">再来一局新人生</button>
</div>
</body></html>
