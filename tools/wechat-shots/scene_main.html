<!doctype html><html><head><meta charset="utf-8"><style>
:root{
  --bg:#0e1017;
  --panel:#181c26;
  --panel-light:#222838;
  --border:#2f3647;
  --gold:#ffbe0b;
  --cyan:#00f0ff;
  --red:#ff3366;
  --green:#05dfb7;
  --text:#f0f4fc;
  --sub:#8e99ae;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  width:375px;height:812px;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  overflow:hidden;display:flex;flex-direction:column;
}
.wx-topbar{
  height:44px;padding:0 16px;display:flex;justify-content:space-between;align-items:center;
  background:#11131a;border-bottom:1px solid rgba(255,255,255,0.08);flex-shrink:0;
}
.wx-game-name{font-size:14px;font-weight:bold;color:#fff}
.wx-capsule{
  width:84px;height:30px;border:1px solid rgba(255,255,255,0.25);background:rgba(0,0,0,0.5);
  border-radius:15px;display:flex;align-items:center;justify-content:space-around;padding:0 6px;
}
.wx-dots{display:flex;gap:3px}
.wx-dots span{width:4px;height:4px;background:#fff;border-radius:50%}
.wx-divider{width:1px;height:14px;background:rgba(255,255,255,0.2)}
.wx-circle{width:13px;height:13px;border:2px solid #fff;border-radius:50%}

.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:30px 20px;text-align:center;background:radial-gradient(circle at 50% 20%, #1e2638 0%, #0e1017 70%)}
.title{font-size:26px;font-weight:900;color:#fff;letter-spacing:1px;line-height:1.3;margin-top:10px}
.subtitle{font-size:11px;color:var(--cyan);letter-spacing:3px;margin-top:6px}
.card-box{width:280px;background:var(--panel);border:1.5px solid var(--cyan);border-radius:12px;padding:24px 20px;box-shadow:0 0 24px rgba(0,240,255,0.15);display:flex;flex-direction:column;align-items:center}
.relic-icon{font-size:60px;margin-bottom:12px;filter:drop-shadow(0 0 10px rgba(255,190,11,0.5))}
.relic-name{font-size:18px;font-weight:bold;color:#fff;margin-bottom:6px}
.relic-tag{font-size:11px;color:var(--gold);background:rgba(255,190,11,0.15);border:1px solid var(--gold);padding:2px 8px;border-radius:4px;margin-bottom:12px}
.relic-desc{font-size:12px;color:var(--sub);line-height:1.6}
.btn{width:240px;height:48px;background:linear-gradient(135deg, #00f0ff, #0077ff);border:none;border-radius:24px;color:#000;font-size:16px;font-weight:bold;cursor:pointer;box-shadow:0 4px 16px rgba(0,240,255,0.4)}
</style></head><body>
<div class="wx-topbar"><div class="wx-game-name">穿越了这次我带大喇叭逆袭</div><div class="wx-capsule"><div class="wx-dots"><span></span><span></span><span></span></div><div class="wx-divider"></div><div class="wx-circle"></div></div></div>
<div class="hero">
  <div><div class="title">穿越了这次我带<br>大喇叭逆袭</div><div class="subtitle">单机架空历史人生推演</div></div>
  <div class="card-box">
    <div class="relic-icon">📢</div>
    <div class="relic-name">收废品大喇叭</div>
    <div class="relic-tag">SR 现代稀有词条</div>
    <div class="relic-desc">红白外壳，自带高音循环扩音。嗓门能借电放大，在古代市井具有绝对的威慑力与信息差。</div>
  </div>
  <div>
    <button class="btn">开启全新人生</button>
    <div style="font-size:10px;color:var(--sub);margin-top:10px">纯单机本地推演 · 不作为史实依据</div>
  </div>
</div>
</body></html>
