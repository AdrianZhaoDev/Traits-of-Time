<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>

:root{
  color-scheme:dark;
  --bg-dark:#0c0d12;
  --bg-desk:#13151c;
  --panel-bg:#1a1d26;
  --panel-raised:#222633;
  --border-dim:#353b49;
  --border-light:#525b6e;
  --text-main:#edf1f7;
  --text-sub:#8c96a8;
  --text-muted:#5e6677;
  --cyan-modern:#00f0ff;
  --gold-val:#ffbe0b;
  --red-death:#ff2a5f;
  --green-life:#05dfb7;
  --purple-relic:#c77dff;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
  --font-sans:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --font-serif:"Songti SC","SimSun","Noto Serif CJK SC",serif;
}
*{box-sizing:border-box}
body{
  margin:0;padding:24px;background:#06070a;color:var(--text-main);font:14px/1.6 var(--font-sans);
}
.header-box{
  text-align:center;margin-bottom:24px;border-bottom:1px solid #202430;padding-bottom:16px;
}
.header-box h1{margin:0 0 8px 0;font-size:20px;color:var(--cyan-modern)}
.header-box p{margin:0;font-size:13px;color:var(--text-sub)}

.screens-container{
  display:flex;flex-wrap:wrap;gap:30px;justify-content:center;
}
.screen-column{
  display:flex;flex-direction:column;align-items:center;
}
.screen-tag{
  background:#1a1d26;border:1px solid var(--border-dim);color:var(--gold-val);
  font-size:12px;font-weight:bold;padding:4px 12px;border-radius:12px;margin-bottom:12px;
}

/* 微信小游戏手机外壳 (375 x 812 标准比例) */
.phone-case{
  width:375px;height:812px;background:var(--bg-desk);border:8px solid #202430;border-radius:36px;
  overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 16px 40px rgba(0,0,0,0.8);
}

/* 微信原生胶囊与导航栏 */
.wx-topbar{
  height:44px;padding:0 16px;display:flex;justify-content:space-between;align-items:center;
  background:#11131a;border-bottom:1px solid rgba(255,255,255,0.06);z-index:20;flex-shrink:0;
}
.wx-game-name{
  font-size:14px;font-weight:bold;color:#fff;max-width:210px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.wx-capsule{
  width:84px;height:30px;border:1px solid rgba(255,255,255,0.2);background:rgba(0,0,0,0.4);
  backdrop-filter:blur(10px);border-radius:15px;display:flex;align-items:center;justify-content:space-around;padding:0 6px;
}
.wx-dots{display:flex;gap:3px}
.wx-dots span{width:4px;height:4px;background:#fff;border-radius:50%}
.wx-divider{width:1px;height:14px;background:rgba(255,255,255,0.2)}
.wx-circle{width:13px;height:13px;border:2px solid #fff;border-radius:50%}

/* HUD Header 纪年与身份 */
.hud-header{
  background:#161922;border-bottom:1px solid var(--border-dim);padding:8px 12px;flex-shrink:0;
}
.era-line{display:flex;justify-content:space-between;align-items:center}
.era-text{font-family:var(--font-serif);font-size:14px;font-weight:bold;color:var(--gold-val);letter-spacing:1px}
.turn-badge{font-family:var(--font-mono);font-size:11px;background:#242a38;color:var(--text-sub);padding:1px 6px;border-radius:2px}
.identity-badge{
  margin-top:4px;display:flex;align-items:center;justify-content:space-between;
  background:#11131a;border:1px solid var(--border-dim);padding:3px 8px;border-radius:3px;font-size:11px;color:var(--text-sub);
}
.identity-main{color:#d8e2ec;font-weight:bold}

/* 五维属性铜钱栏 */
.stat-coins-grid{
  display:grid;grid-template-columns:repeat(5, 1fr);gap:4px;
  background:#11131a;border-bottom:1px solid var(--border-dim);padding:6px 8px;flex-shrink:0;
}
.coin-item{
  text-align:center;padding:2px;background:#181c26;border:1px solid rgba(255,255,255,0.04);border-radius:2px;
}
.coin-name{font-size:9px;color:var(--text-muted);display:block}
.coin-val{font-family:var(--font-mono);font-size:12px;font-weight:bold;color:var(--gold-val)}

/* 视窗核心：左侧信息流 + 右侧博古架 */
.viewport-body{
  flex:1;display:flex;position:relative;overflow:hidden;background:#0e1017;
}
.stream-area{
  flex:1;display:flex;flex-direction:column;padding:12px;overflow-y:auto;gap:10px;
}
.relic-shelf-rail{
  width:64px;background:#141720;border-left:1px solid var(--border-dim);
  display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:10px;flex-shrink:0;
}
.shelf-title{font-size:10px;color:var(--text-muted);writing-mode:vertical-rl;letter-spacing:2px;margin-bottom:4px}
.shelf-slot{
  width:46px;height:46px;border:1px solid var(--border-dim);background:#1a1d26;
  border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:22px;position:relative;cursor:pointer;
}
.shelf-slot.active{
  border-color:var(--cyan-modern);box-shadow:0 0 10px rgba(0,240,255,0.25);background:#182430;
}
.slot-badge{
  position:absolute;bottom:-3px;right:-3px;font-size:9px;background:var(--cyan-modern);color:#000;
  padding:0 3px;border-radius:2px;font-weight:bold;font-family:var(--font-mono);
}

/* 折页事件卡片 */
.fold-card{
  background:var(--panel-bg);border:1px solid var(--border-dim);border-radius:6px;padding:12px;position:relative;
}
.fold-card.highlight{border-color:var(--cyan-modern);background:#161d28}
.fold-tag{
  font-size:10px;font-family:var(--font-mono);padding:2px 6px;border-radius:2px;display:inline-block;margin-bottom:6px;
}
.fold-tag.cyan{background:rgba(0,240,255,0.15);color:var(--cyan-modern);border:1px solid rgba(0,240,255,0.4)}
.fold-tag.gold{background:rgba(255,190,11,0.15);color:var(--gold-val);border:1px solid rgba(255,190,11,0.4)}
.fold-title{font-size:14px;font-weight:bold;color:#fff;margin-bottom:6px}
.fold-desc{font-size:12px;color:var(--text-sub);line-height:1.5}
.fold-reaction{
  background:#121620;border-left:2px solid var(--cyan-modern);padding:6px 8px;margin-top:8px;font-size:11px;color:var(--cyan-modern);
}

/* 选项组 */
.options-box{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.opt-btn{
  background:#222736;border:1px solid var(--border-light);color:var(--text-main);
  padding:8px 10px;border-radius:4px;font-size:12px;font-weight:600;display:flex;justify-content:space-between;align-items:center;
}
.opt-btn.primary{
  border-color:var(--cyan-modern);background:linear-gradient(90deg, #162a38, #1c2333);color:#fff;
}
.opt-hint{font-size:10px;color:var(--gold-val)}

/* 界面1：开局/主界面特有 */
.start-view{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;
}
.title-glitch{
  font-family:var(--font-serif);font-size:26px;font-weight:900;color:#fff;letter-spacing:1px;margin-bottom:6px;
  text-shadow:0 0 12px rgba(0,240,255,0.4);
}
.sub-glitch{font-size:11px;font-family:var(--font-mono);color:var(--cyan-modern);letter-spacing:2px;margin-bottom:24px}
.relic-spotlight{
  width:260px;background:#181d29;border:1px solid var(--cyan-modern);box-shadow:0 0 24px rgba(0,240,255,0.15);
  border-radius:8px;padding:20px 16px;display:flex;flex-direction:column;align-items:center;margin-bottom:30px;
}
.relic-big-icon{font-size:54px;margin-bottom:10px}
.relic-title{font-size:16px;font-weight:bold;color:#fff;margin-bottom:4px}
.relic-rarity{font-size:10px;color:var(--gold-val);font-family:var(--font-mono);margin-bottom:8px}
.relic-desc{font-size:12px;color:var(--text-sub);line-height:1.5}
.btn-launch{
  width:220px;height:44px;background:linear-gradient(135deg, #00f0ff, #0077ff);border:none;border-radius:4px;
  color:#000;font-size:15px;font-weight:bold;cursor:pointer;box-shadow:0 4px 16px rgba(0,240,255,0.3);letter-spacing:1px;
}

/* 界面3：结算终局画卷 */
.end-view{
  flex:1;display:flex;flex-direction:column;padding:14px;background:#10131a;overflow-y:auto;
}
.end-card{
  background:#181c26;border:1px solid var(--border-dim);border-radius:8px;padding:16px;display:flex;flex-direction:column;align-items:center;text-align:center;
}
.end-epitaph{font-size:11px;color:var(--gold-val);letter-spacing:2px;margin-bottom:4px;font-family:var(--font-mono)}
.end-title{font-size:22px;font-weight:900;color:#fff;margin-bottom:10px;font-family:var(--font-serif)}
.end-text{font-size:12px;color:var(--text-sub);line-height:1.6;margin-bottom:16px}
.achieve-box{
  width:100%;background:#13151f;border:1px solid var(--border-dim);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:8px;margin-bottom:16px;text-align:left;
}
.ach-title{font-size:11px;font-weight:bold;color:var(--text-muted);border-bottom:1px solid var(--border-dim);padding-bottom:4px}
.ach-row{display:flex;align-items:center;gap:8px;font-size:12px}
.ach-name{font-weight:bold;color:var(--gold-val)}
.ach-desc{font-size:11px;color:var(--text-sub)}

/* 界面4：博古架/资产系统 */
.inventory-grid{
  display:grid;grid-template-columns:repeat(2, 1fr);gap:10px;padding:12px;flex:1;
}
.inv-card{
  background:#181c26;border:1px solid var(--border-dim);border-radius:6px;padding:12px;display:flex;flex-direction:column;align-items:center;text-align:center;
}
.inv-card.active{border-color:var(--cyan-modern);background:#162330}
.inv-icon{font-size:32px;margin-bottom:6px}
.inv-name{font-size:13px;font-weight:bold;color:#fff;margin-bottom:2px}
.inv-tag{font-size:10px;font-family:var(--font-mono);color:var(--cyan-modern);margin-bottom:6px}
.inv-desc{font-size:11px;color:var(--text-sub);line-height:1.4}

body {
  margin: 0;
  padding: 0;
  background: transparent;
  display: flex;
  justify-content: flex-start;
  align-items: flex-start;
  width: 375px;
  height: 812px;
}
.phone-case {
  width: 375px !important;
  height: 812px !important;
  margin: 0 !important;
  border: none !important;
  border-radius: 0 !important;
  box-shadow: none !important;
}
</style>
</head>
<body>
<div class="phone-case">

      <div class="wx-topbar">
        <div class="wx-game-name">穿越了这次我带大喇叭逆袭</div>
        <div class="wx-capsule">
          <div class="wx-dots"><span></span><span></span><span></span></div>
          <div class="wx-divider"></div>
          <div class="wx-circle">
</div>
</body>
</html>
