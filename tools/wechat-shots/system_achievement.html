<!doctype html>
<html>
<head><meta charset="utf-8"><style>
:root{
  color-scheme:dark;
  --bg-dark:#0c0d12;
  --bg-desk:#13151c;
  --panel-bg:#1a1d26;
  --border-dim:#353b49;
  --border-light:#525b6e;
  --text-main:#edf1f7;
  --text-sub:#8c96a8;
  --text-muted:#5e6677;
  --cyan-modern:#00f0ff;
  --gold-val:#ffbe0b;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
  --font-sans:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --font-serif:"Songti SC","SimSun","Noto Serif CJK SC",serif;
}
*{box-sizing:border-box}
html, body{
  margin:0;padding:0;width:375px;height:812px;background:#090a0e;font:14px/1.6 var(--font-sans);color:var(--text-main);overflow:hidden;
}
.wx-topbar{
  height:44px;padding:0 16px;display:flex;justify-content:space-between;align-items:center;
  background:#11131a;border-bottom:1px solid rgba(255,255,255,0.06);
}
.wx-game-name{font-size:14px;font-weight:bold;color:#fff}
.wx-capsule{
  width:84px;height:30px;border:1px solid rgba(255,255,255,0.2);background:rgba(0,0,0,0.4);
  backdrop-filter:blur(10px);border-radius:15px;display:flex;align-items:center;justify-content:space-around;padding:0 6px;
}
.wx-dots{display:flex;gap:3px}
.wx-dots span{width:4px;height:4px;background:#fff;border-radius:50%}
.wx-divider{width:1px;height:14px;background:rgba(255,255,255,0.2)}
.wx-circle{width:13px;height:13px;border:2px solid #fff;border-radius:50%}

.header-title{
  background:#161922;padding:12px 16px;border-bottom:1px solid var(--border-dim);display:flex;justify-content:space-between;align-items:center;
}
.header-title h2{margin:0;font-size:15px;color:#fff}
.header-title span{font-size:11px;color:var(--gold-val);font-family:var(--font-mono)}

.content-box{padding:14px;height:calc(812px - 90px);overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.card{
  background:var(--panel-bg);border:1px solid var(--border-dim);border-radius:8px;padding:14px;
}
</style></head>
<body>
<div class="wx-topbar">
  <div class="wx-game-name">穿越了这次我带大喇叭逆袭</div>
  <div class="wx-capsule"><div class="wx-dots"><span></span><span></span><span></span></div><div class="wx-divider"></div><div class="wx-circle"></div></div>
</div>
<div class="header-title">
  <h2>人生荣誉成就系统</h2>
  <span>全生平探索图鉴</span>
</div>
<div class="content-box">
  <div class="card" style="display:flex;align-items:center;gap:12px">
    <div style="font-size:32px">🏆</div>
    <div>
      <div style="font-size:14px;font-weight:bold;color:var(--gold-val)">【叫号有序】· 道具成就</div>
      <div style="font-size:11px;color:var(--text-sub)">在灾年大喇叭维持秩序，化解千人踩踏危机</div>
    </div>
  </div>

  <div class="card" style="display:flex;align-items:center;gap:12px">
    <div style="font-size:32px">👑</div>
    <div>
      <div style="font-size:14px;font-weight:bold;color:var(--gold-val)">【开国之主】· 终极天命</div>
      <div style="font-size:11px;color:var(--text-sub)">在乱世风云中定鼎天下，国号载入青史</div>
    </div>
  </div>

  <div class="card" style="display:flex;align-items:center;gap:12px">
    <div style="font-size:32px">📜</div>
    <div>
      <div style="font-size:14px;font-weight:bold;color:#fff">【入阁拜相】· 文臣巅峰</div>
      <div style="font-size:11px;color:var(--text-sub)">士绅科举登科，位极人臣运筹帷幄</div>
    </div>
  </div>

  <div class="card" style="display:flex;align-items:center;gap:12px">
    <div style="font-size:32px">🍵</div>
    <div>
      <div style="font-size:14px;font-weight:bold;color:#fff">【福寿双全】· 安稳寿终</div>
      <div style="font-size:11px;color:var(--text-sub)">度过风云激荡的十八年，七十古稀安详离世</div>
    </div>
  </div>
</div>
</body>
</html>
